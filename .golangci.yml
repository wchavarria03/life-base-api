version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - unconvert
    - gocyclo
    - dupl
    - gocritic
    - revive
  settings:
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    misspell:
      locale: US
  exclusions:
    paths:
      - app/internal/parser/parsers/bac/testdata
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - gocyclo

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - app/internal/parser/parsers/bac/testdata

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
