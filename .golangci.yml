version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - unconvert
    - gocyclo
    - dupl
    - gocritic
    - revive
  settings:
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    misspell:
      locale: US
  exclusions:
    paths:
      - app/internal/parser/parsers/bac/testdata
    rules:
      # Doc-comment style nits (revive exported / package-comments). The
      # codebase documents behavior where it is non-obvious rather than
      # restating every method name, so these are not enforced.
      - linters:
          - revive
        text: "should have comment or be unexported|should have a package comment|should be of the form|should have comment \\(or a comment on this block\\)"
      # Spanish bank-statement keywords (Producto, COMISION, ...) are data,
      # not English prose.
      - path: app/internal/parser/parsers/bac/
        linters:
          - misspell
      - path: _test\.go
        linters:
          - gosec
          - dupl
          - gocyclo

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - app/internal/parser/parsers/bac/testdata

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
